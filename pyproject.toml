[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cohesian-tether"
version = "0.3.0"
description = "Bridge graph resource targets and contributor-owned stores"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[project.scripts]
tether = "tether.cli:main"

[tool.setuptools]
packages = ["tether"]
